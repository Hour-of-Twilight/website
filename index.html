<style>
  :root {
    --gold: #e8c172;
    --gold-dim: rgba(232, 193, 114, 0.7);
    --gold-edge: #9c7a3c;
    --teal: #6fe6e0;
    --frost: #d6ebe8;
    --frost-dim: rgba(150, 214, 208, 0.6);
    --serif: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                url('/assets/img/background.jpg') center / cover no-repeat fixed #000;
    font-family: var(--serif);
  }
  video { width: min(854px, 100%); height: auto; display: block; }

  /* Navigation: gold medallion buttons, label underneath */
  nav {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 8px;
    margin-top: -2vw; /* tuck up into the video's empty bottom padding */
  }
  nav a {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 7.5rem; /* equal widths keep the medallions symmetric despite different label lengths */
    color: var(--gold); text-decoration: none; outline: none;
  }
  .medallion {
    width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, #2a2418, #0c0b08 70%);
    border: 2px solid var(--gold-edge);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.8), inset 0 2px 6px rgba(232, 193, 114, 0.25),
                0 3px 10px rgba(0, 0, 0, 0.7);
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  }
  .medallion svg { width: 28px; height: 28px; transition: color 0.2s; }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    padding-left: 0.14em; /* balance the trailing letter-spacing so the text centres optically */
    color: var(--gold-dim); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    transition: color 0.2s;
  }
  nav a:hover .medallion, nav a:focus-visible .medallion {
    border-color: var(--teal); transform: translateY(-2px);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(111, 230, 224, 0.35),
                0 0 16px rgba(111, 230, 224, 0.45), 0 3px 10px rgba(0, 0, 0, 0.7);
  }
  nav a:hover svg, nav a:focus-visible svg { color: var(--teal); }
  nav a:hover .label, nav a:focus-visible .label { color: var(--teal); }

  /* Countdowns: cool silver-teal on a quiet panel, so they read as information, not buttons */
  .timers {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
    width: 100%; margin-top: 30px;
  }
  .timer {
    text-align: center; padding: 12px 18px 10px;
    background: rgba(4, 14, 14, 0.5);
    border: 1px solid rgba(111, 230, 224, 0.16); border-radius: 4px;
  }
  .timer h2 {
    margin: 0 0 8px; padding-left: 0.18em; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--frost-dim);
  }
  .clock { display: flex; justify-content: center; align-items: flex-start; gap: 2px; }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .num { display: flex; font-size: 24px; font-weight: 500; line-height: 1; color: var(--frost); }
  /* Every digit gets a fixed-width cell so nothing shifts as the numbers change */
  .num span { width: 0.78em; text-align: center; }
  .lbl { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--frost-dim); margin-top: 5px; }
  .colon { font-size: 20px; line-height: 1; color: rgba(150, 214, 208, 0.35); width: 0.6em; text-align: center; }
  .when {
    margin-top: 8px; font: 11px/1.3 Georgia, 'Times New Roman', serif;
    color: rgba(214, 235, 232, 0.5);
  }
  .live { font-size: 20px; color: var(--teal); text-shadow: 0 0 12px rgba(111, 230, 224, 0.6); }

<section class="timers">
  <!-- Times come from the matching Event "startDate" in the JSON-LD block in <head>. -->
  <div class="timer" data-event="stability-test">
    <h2>Stability Test</h2>
    <div class="clock"></div>
    <div class="when"></div>
  </div>
  <div class="timer" data-event="beta-launch">
    <h2>Beta Launch</h2>
    <div class="clock"></div>
    <div class="when"></div>
  </div>
</section>

<script>
  // Show each launch in the viewer's own timezone, e.g. "Sat, Nov 28, 12:00 PM EST".
  const fmt = new Intl.DateTimeFormat(undefined, {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
  });

  // Launch times live in one place: the Event entries of the JSON-LD structured data.
  const graph = JSON.parse(document.querySelector('script[type="application/ld+json"]').textContent)['@graph'];
  const startOf = id => graph.find(n => n['@id'].endsWith('#' + id)).startDate;

  // Build each clock once; ticks only swap digit text so the layout never moves.
  const timers = [...document.querySelectorAll('.timer')].map(el => {
    const target = Date.parse(startOf(el.dataset.event));
    el.querySelector('.when').textContent = fmt.format(target);
    const clock = el.querySelector('.clock');
    clock.innerHTML = ['Days', 'Hrs', 'Min', 'Sec']
      .map(l => `<div class="unit"><span class="num"><span></span><span></span></span><span class="lbl">${l}</span></div>`)
      .join('<span class="colon">:</span>');
    return { target, clock, digits: [...clock.querySelectorAll('.num span')] };
  });

  function tick() {
    const now = Date.now();
    for (const t of timers) {
      let s = Math.floor((t.target - now) / 1000);
      if (s <= 0) {
        if (!t.live) { t.clock.innerHTML = '<span class="live">Live Now</span>'; t.live = true; }
        continue;
      }
      const parts = [Math.floor(s / 86400), Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60];
      const text = parts.map(n => String(Math.min(n, 99)).padStart(2, '0')).join('');
      t.digits.forEach((d, i) => { if (d.textContent !== text[i]) d.textContent = text[i]; });
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
